    <rect x="24" y="80" width="122" height="10" rx="5" fill="#f0d9c4"/>
    <rect x="24" y="102" width="80" height="10" rx="5" fill="#f0d9c4"/>
    <rect x="24" y="130" width="70" height="22" rx="11" fill="#3b2314"/>
